# =============================================================================
# Release & Publish — Sun Haven mods (GitHub Releases + Thunderstore + Nexus)
# Pattern from RimWorld Release & Publish: dispatch → matrix → build → zip →
# optional GitHub tag Name-vVERSION → optional store upload.
#
# Version comes from docs/versions.json (not About.xml). Optional bump_version
# writes that file, syncs plugin/manifest strings, and pushes before the build.
# Compile uses the self-hosted runner (BepInEx + Sun Haven Managed).
# PR compile gate is Build mods, not this workflow.
# =============================================================================
name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build + package + artifact only; no external publish)"
        required: true
        type: boolean
        default: false
      build_only:
        description: "Build only (DLL artifacts; skip package/release/publish job)"
        required: false
        type: boolean
        default: false
      bump_version:
        description: "Bump semver in versions.json before build (none = use branch as-is)"
        required: false
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: none
      release_changelog:
        description: "Optional changelog written to versions.json before bump (mod or all)"
        required: false
        type: string
        default: ""
      mod:
        description: "Which mod to release"
        required: true
        type: choice
        options:
          - all
          - havensbirthright
          - sunhavenmuseumutilitytracker
          - squirrelsbirthdayreminder
          - sunhaventodo
          - thevault
          - havendevtools
          - senpaischest
          - havensalmanac
          - fasterraces
          - trinketfortune
          - cropoptimizer
          - havensrespec
          - giftingassistant
          - havensmirror
      publish_thunderstore:
        description: "Publish to Thunderstore?"
        required: true
        type: boolean
        default: false
      publish_nexus:
        description: "Upload the zip to Nexus Mods?"
        required: false
        type: boolean
        default: false
      create_github_release:
        description: "Create a versioned GitHub Release?"
        required: true
        type: boolean
        default: false
      release_anyway:
        description: "Ignore GitHub / Thunderstore / Nexus version compare and publish anyway"
        required: false
        type: boolean
        default: false
      test_discord:
        description: "Test Discord notification only"
        required: false
        type: boolean
        default: false
      publish_discord_only:
        description: "Discord only (no package/publish from this job)"
        required: false
        type: boolean
        default: false
      ignore_discord_notify:
        description: "Skip all Discord steps for this run"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-mod-${{ github.event.inputs.mod }}
  cancel-in-progress: false

env:
  THUNDERSTORE_NAMESPACE: "AzraelGodKing"
  THUNDERSTORE_COMMUNITY: "sun-haven"
  THUNDERSTORE_CATEGORIES: "mods"
  THUNDERSTORE_DEPS: "BepInEx-BepInExPack@5.4.2100"

permissions:
  contents: write

jobs:
  version:
    name: Version bump & sync
    if: github.event.inputs.build_only != 'true'
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_PUSH_TOKEN || github.token }}

      - name: Apply release changelog text
        if: github.event.inputs.bump_version != 'none' && github.event.inputs.release_changelog != ''
        shell: bash
        env:
          CHANGELOG: ${{ github.event.inputs.release_changelog }}
          MOD_INPUT: ${{ github.event.inputs.mod }}
        run: |
          set -euo pipefail
          if [ "$MOD_INPUT" == "all" ]; then
            python3 scripts/version/set-versions-changelog.py --all --text "$CHANGELOG"
          else
            python3 scripts/version/set-versions-changelog.py --mod "$MOD_INPUT" --text "$CHANGELOG"
          fi

      - name: Bump and sync version strings
        if: github.event.inputs.bump_version != 'none'
        shell: pwsh
        env:
          MOD_INPUT: ${{ github.event.inputs.mod }}
          BUMP: ${{ github.event.inputs.bump_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:MOD_INPUT -eq 'all') {
            ./scripts/version/pre-push-build.ps1 -All -Bump $env:BUMP -SyncOnly
          } else {
            ./scripts/version/pre-push-build.ps1 -Mod $env:MOD_INPUT -Bump $env:BUMP -SyncOnly
          }

      - name: Verify version consistency
        if: github.event.inputs.bump_version != 'none'
        run: python3 scripts/version/verify-version-consistency.py

      - name: Commit and push version bump
        if: github.event.inputs.bump_version != 'none'
        env:
          BUMP: ${{ github.event.inputs.bump_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/version/stage-version-sync-files.py
          if git diff --staged --quiet; then
            echo "::error::Bump produced no file changes — check bump_version and mod selection"
            exit 1
          fi
          git commit -m "chore(release): bump ${{ github.event.inputs.mod }} ${BUMP} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Record commit ref for downstream jobs
        id: meta
        run: echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  setup:
    name: Mod matrix
    needs: version
    if: always() && (needs.version.result == 'success' || needs.version.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref || github.sha }}

      - name: Setup Node.js (mod-matrix doc sync check)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: docs/mod-matrix.json must match scripts/matrix/mod-matrix.json
        run: |
          node scripts/matrix/sync-docs-mod-matrix.js
          git diff --exit-code docs/mod-matrix.json

      - name: Verify version consistency
        run: python3 scripts/version/verify-version-consistency.py

      - name: Set mod matrix
        id: set-matrix
        shell: bash
        env:
          TEST_DISCORD: ${{ github.event.inputs.test_discord }}
          MOD_INPUT: ${{ github.event.inputs.mod }}
        run: |
          set -euo pipefail
          if [ "$TEST_DISCORD" == "true" ]; then
            echo 'matrix=["test_discord"]' >> "$GITHUB_OUTPUT"
          elif [ "$MOD_INPUT" == "all" ]; then
            echo "matrix=$(jq -c '[.[].modKey]' scripts/matrix/mod-matrix.json)" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[\"$MOD_INPUT\"]" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.mod }}
    needs: [setup, version]
    if: always() && needs.setup.result == 'success' && (needs.version.result == 'success' || needs.version.result == 'skipped')
    runs-on: [self-hosted, Linux, X64, sunhaven]
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Runner self-check (dispatch)
        if: github.event.inputs.dry_run == 'true' || github.event.inputs.build_only == 'true'
        shell: bash
        run: |
          echo "runner.name=${{ runner.name }}"
          echo "runner.os=${{ runner.os }}"
          if [ "${{ github.event.inputs.build_only }}" == "true" ]; then
            echo "build_only: release job skipped."
          elif [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "dry_run: publish steps skipped in release job."
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref || github.sha }}

      - name: Setup .NET SDK
        if: matrix.mod != 'test_discord'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
          DOTNET_ROOT: ${{ runner.temp }}/dotnet

      - name: Set build targets from mod matrix
        if: matrix.mod != 'test_discord'
        id: build_config
        shell: bash
        run: |
          set -euo pipefail
          MOD_KEY="${{ matrix.mod }}"
          MOD_JSON="$(jq -c --arg key "$MOD_KEY" '.[] | select(.modKey == $key)' scripts/matrix/mod-matrix.json)"
          if [ -z "$MOD_JSON" ]; then
            echo "::error::Unknown mod: $MOD_KEY"
            exit 1
          fi
          echo "mod_dir=$(echo "$MOD_JSON" | jq -r '.modDir')" >> "$GITHUB_OUTPUT"
          echo "dll_name=$(echo "$MOD_JSON" | jq -r '.dllName')" >> "$GITHUB_OUTPUT"
          echo "csproj=$(echo "$MOD_JSON" | jq -r '.csproj')" >> "$GITHUB_OUTPUT"

      - name: Build mod
        if: matrix.mod != 'test_discord'
        shell: bash
        env:
          BEPINEX_PATH: /sunhaven/BepInEx
          MANAGED_PATH: "/sunhaven/Sun Haven_Data/Managed"
        run: |
          set -euo pipefail
          dotnet restore "${{ steps.build_config.outputs.csproj }}"
          dotnet build "${{ steps.build_config.outputs.csproj }}" -c Release --nologo \
            -p:BepInExPath="$BEPINEX_PATH" \
            -p:ManagedPath="$MANAGED_PATH" \
            -p:SunhavenCopyToBepInExPlugins=false

      # builds/<ModDir>/ is runner-local staging for upload-artifact, not a committed tree.
      - name: Collect build outputs
        if: matrix.mod != 'test_discord'
        shell: bash
        run: |
          set -euo pipefail
          MOD_DIR="${{ steps.build_config.outputs.mod_dir }}"
          DLL_NAME="${{ steps.build_config.outputs.dll_name }}"
          SRC_DLL="$MOD_DIR/bin/Release/net48/$DLL_NAME.dll"
          DEST_DIR="builds/$MOD_DIR"
          mkdir -p "$DEST_DIR"
          test -f "$SRC_DLL" || { echo "::error::Missing $SRC_DLL"; exit 1; }
          cp "$SRC_DLL" "$DEST_DIR/"
          if [ "${{ matrix.mod }}" = "thevault" ]; then
            ABS_SRC="TheVault.Abstractions/bin/Release/netstandard2.0/TheVault.Abstractions.dll"
            test -f "$ABS_SRC" || { echo "::error::Missing $ABS_SRC"; exit 1; }
            cp "$ABS_SRC" "$DEST_DIR/"
          fi

      - name: Upload built DLL artifact
        if: matrix.mod != 'test_discord'
        uses: actions/upload-artifact@v4
        with:
          name: built-${{ matrix.mod }}
          path: builds/${{ steps.build_config.outputs.mod_dir }}/*.dll
          if-no-files-found: error

  # always() is required. A job that depends on this matrix build is skipped
  # unless its if starts with always() (runs #124–#139).
  release:
    name: release (${{ matrix.mod }})
    needs: [setup, build, version]
    if: always() && github.event.inputs.build_only != 'true' && needs.build.result == 'success' && (needs.version.result == 'success' || needs.version.result == 'skipped')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJson(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/reusable-release-mod.yml
    with:
      mod: ${{ matrix.mod }}
      ref: ${{ needs.version.outputs.ref || github.sha }}
      dry_run: ${{ github.event.inputs.dry_run }}
      publish_thunderstore: ${{ github.event.inputs.publish_thunderstore }}
      publish_nexus: ${{ github.event.inputs.publish_nexus }}
      create_github_release: ${{ github.event.inputs.create_github_release }}
      release_anyway: ${{ github.event.inputs.release_anyway }}
      test_discord: ${{ github.event.inputs.test_discord }}
      publish_discord_only: ${{ github.event.inputs.publish_discord_only }}
      ignore_discord_notify: ${{ github.event.inputs.ignore_discord_notify }}
    secrets: inherit

  release_aggregate_report:
    name: Combined release report
    needs: [release]
    if: always() && github.event.inputs.build_only != 'true' && needs.release.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Download per-mod reports
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: release-report-*
          path: aggregated-reports
          merge-multiple: true

      - name: Write combined summary
        run: |
          set -euo pipefail
          {
            echo "# Combined release report"
            echo ""
            echo "Workflow run: [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · ref \`${{ github.ref_name }}\` · event \`${{ github.event_name }}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          ROOT="aggregated-reports"
          mapfile -t FILES < <(find "$ROOT" -type f -name '*.md' 2>/dev/null | sort)
          if [ ! -d "$ROOT" ] || [ "${#FILES[@]}" -eq 0 ]; then
            {
              echo "## No report files"
              echo ""
              echo "No \`release-report-*\` artifacts were found."
              echo ""
              echo "**Release job result:** \`${{ needs.release.result }}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Mods in this report (${#FILES[@]})"
            echo ""
            for f in "${FILES[@]}"; do
              base="$(basename "$f" .md)"
              echo "- \`${base}\`"
            done
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          for f in "${FILES[@]}"; do
            {
              echo "---"
              echo ""
              cat "$f"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          done

  website:
    name: Rebuild website
    # The site reads changelogs and versions from this repo when it builds, so
    # start a mod-website build on Buildkite after a real release. An API-started
    # build deploys (scripts/ci-queue-deploy.sh in mod-website).
    needs: [release]
    if: always() && github.event.inputs.dry_run != 'true' && github.event.inputs.build_only != 'true' && github.event.inputs.test_discord != 'true' && github.event.inputs.publish_discord_only != 'true' && needs.release.result != 'skipped' && needs.release.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Start a mod-website build on Buildkite
        env:
          BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_TOKEN }}
          MOD: ${{ github.event.inputs.mod }}
        run: |
          set -euo pipefail
          if [ -z "${BUILDKITE_TOKEN}" ]; then
            echo "::warning::BUILDKITE_TOKEN is not set, so the website was not rebuilt. It picks up this release on its next build."
            exit 0
          fi
          BODY="$(jq -n --arg msg "${GITHUB_REPOSITORY} released ${MOD}" \
            '{commit: "HEAD", branch: "main", message: $msg}')"
          if ! curl -fsS -X POST \
            -H "Authorization: Bearer ${BUILDKITE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            -o build.json \
            "https://api.buildkite.com/v2/organizations/azraelgodking/pipelines/mod-website/builds"; then
            echo "::warning::Buildkite did not accept the website build. Start it by hand or wait for the next build."
            exit 0
          fi
          URL="$(jq -r '.web_url' build.json)"
          echo "Website build: ${URL}"
          echo "Website build started: ${URL}" >> "$GITHUB_STEP_SUMMARY"
